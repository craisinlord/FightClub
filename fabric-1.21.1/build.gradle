import org.gradle.util.GradleVersion

buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        if(GradleVersion.current() >= GradleVersion.version('9.0')) {
            classpath 'net.fabricmc.fabric-loom-remap:net.fabricmc.fabric-loom-remap.gradle.plugin:1.15.5'
        } else {
            classpath 'net.fabricmc:fabric-loom:1.10.1'
        }
    }
}

if(GradleVersion.current() >= GradleVersion.version('9.0')) {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
} else {
    apply plugin: 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-1.21.1"
}

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs project(':common-1.21.1').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-1.21.1').sourceSets.main.resources.srcDirs
        }
    }
    dev {
        java {
            srcDirs project(':common-1.21.1').file('src/dev/java')
        }
        resources {
            srcDirs project(':common-1.21.1').file('src/dev/resources')
        }
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_21_1}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21_1}"

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    implementation "com.electronwill.night-config:toml:3.8.3"

    modCompileOnly "maven.modrinth:better-combat:${better_combat_version_1_21_1}-fabric"
    if ((findProperty('dev_better_combat') ?: 'true').toString().toBoolean()) {
        modLocalRuntime "maven.modrinth:better-combat:${better_combat_version_1_21_1}-fabric"
        modLocalRuntime "maven.modrinth:playeranimator:${player_animator_version_1_21_1}-fabric"
        modLocalRuntime "maven.modrinth:cloth-config:${cloth_config_version_1_21_1}+fabric"
        modLocalRuntime "maven.modrinth:tiny-config:${tiny_config_version_1_21_1}-fabric"
    }
}

loom {
    mixin.defaultRefmapName = "${mod_id}.mixins.refmap.json"

    mods {
        register(mod_id) {
            sourceSet sourceSets.main
            sourceSet sourceSets.dev
        }
    }

    runConfigs.named("client") {
        source sourceSets.dev
        programArgs.add("--username")
        programArgs.add("Dev")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_description: mod_description,
        mod_license    : mod_license
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = project.base.archivesName.get()
            version = project.version

            artifact(project.tasks.named('remapJar'))
            artifact(project.tasks.named('remapSourcesJar')) {
                classifier = 'sources'
            }

            pom {
                name = "${mod_name} (Fabric 1.21.1)"
                description = mod_description
            }
        }
    }
    repositories {
        maven {
            name = 'LocalMaven'
            url = findProperty('mavenRepoPath') ? uri(findProperty('mavenRepoPath')) : uri(new File(rootProject.layout.buildDirectory.get().asFile, 'maven-repo'))
        }
    }
}

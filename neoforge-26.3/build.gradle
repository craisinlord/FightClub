plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${mod_id}-neoforge-26.3"
}

neoForge {
    version = neoforge_version_26_3
    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
    runs {
        client { client() }
        server { server() }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

dependencies {
    implementation "com.electronwill.night-config:toml:3.8.3"
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_description: mod_description,
        mod_authors    : mod_authors,
        mod_license    : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets {
    main {
        java {
            srcDirs project(':common-26.3').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-26.3').sourceSets.main.resources.srcDirs
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = project.base.archivesName.get()
            version = project.version
            artifact jar
            artifact sourcesJar
            pom {
                name = "${mod_name} (NeoForge 26.3)"
                description = mod_description
            }
        }
    }
}

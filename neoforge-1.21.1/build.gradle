plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

sourceSets {
    main {
        java {
            srcDirs project(':common-1.21.1').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-1.21.1').sourceSets.main.resources.srcDirs
        }
    }
    dev {
        java {
            srcDirs project(':common-1.21.1').file('src/dev/java')
        }
        resources {
            srcDirs project(':common-1.21.1').file('src/dev/resources')
        }
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

neoForge {
    version = neoforge_version_1_21_1
    mods {
        create(mod_id) {
            sourceSet sourceSets.main
            sourceSet sourceSets.dev
        }
    }
    runs {
        client {
            client()
            sourceSet = sourceSets.dev
        }
        server { server() }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.dev)

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

dependencies {
    implementation "com.electronwill.night-config:toml:3.8.3"

    compileOnly "maven.modrinth:better-combat:${better_combat_version_1_21_1}-neoforge"
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version_1_21_1}"
    if ((findProperty('dev_jei') ?: 'false').toString().toBoolean()) {
        runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version_1_21_1}"
    }
    if ((findProperty('dev_better_combat') ?: 'true').toString().toBoolean()) {
        runtimeOnly "maven.modrinth:better-combat:${better_combat_version_1_21_1}-neoforge"
        runtimeOnly "maven.modrinth:playeranimator:${player_animator_version_1_21_1}-forge"
        runtimeOnly "maven.modrinth:cloth-config:${cloth_config_version_1_21_1}+neoforge"
        runtimeOnly "maven.modrinth:tiny-config:${tiny_config_version_1_21_1}-neoforge"
    }
    if ((findProperty('dev_silent_gear') ?: 'false').toString().toBoolean()) {
        runtimeOnly "maven.modrinth:silent-gear:${silent_gear_version_1_21_1}"
        runtimeOnly "maven.modrinth:silent-lib:${silent_lib_version_1_21_1}"
    }
    if ((findProperty('dev_simply_swords') ?: 'false').toString().toBoolean()) {
        runtimeOnly "maven.modrinth:simply-swords:${simply_swords_version_1_21_1}"
        runtimeOnly "maven.modrinth:architectury-api:${architectury_version_1_21_1}"
        runtimeOnly "maven.modrinth:fzzy-config:${fzzy_config_version_1_21_1}"
        runtimeOnly "maven.modrinth:simply-tooltips:${simply_tooltips_version_1_21_1}"
        runtimeOnly "maven.modrinth:kotlin-for-forge:${kotlin_for_forge_version_1_21_1}"
    }
    if ((findProperty('dev_spartan') ?: 'false').toString().toBoolean()) {
        runtimeOnly "maven.modrinth:spartan-weaponry-reborn:${spartan_reborn_version_1_21_1}"
    }
    if ((findProperty('dev_spartan_unofficial') ?: 'false').toString().toBoolean()) {
        runtimeOnly "maven.modrinth:spartan-weaponry-unofficial:${spartan_unofficial_version_1_21_1}"
    }

}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_description: mod_description,
        mod_authors    : mod_authors,
        mod_license    : mod_license
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = project.base.archivesName.get()
            version = project.version

            artifact jar
            artifact sourcesJar

            pom {
                name = "${mod_name} (NeoForge 1.21.1)"
                description = mod_description
            }
        }
    }
    repositories {
        maven {
            name = 'LocalMaven'
            url = findProperty('mavenRepoPath') ? uri(findProperty('mavenRepoPath')) : uri(new File(rootProject.layout.buildDirectory.get().asFile, 'maven-repo'))
        }
    }
}

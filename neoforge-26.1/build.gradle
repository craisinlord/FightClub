plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${mod_id}-neoforge-26.1"
}

sourceSets {
    main {
        java {
            srcDirs project(':common-26.1').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-26.1').sourceSets.main.resources.srcDirs
        }
    }
    dev {
        java {
            srcDirs 'src/dev/java'
        }
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

neoForge {
    version = neoforge_version_26_1
    mods {
        create(mod_id) {
            sourceSet sourceSets.main
            sourceSet sourceSets.dev
        }
    }
    runs {
        client {
            client()
            sourceSet = sourceSets.dev
        }
        server { server() }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.dev)

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

dependencies {
    implementation "com.electronwill.night-config:toml:3.8.3"
    compileOnly "mezz.jei:jei-26.1-common-api:${jei_version_26_1}"
    if ((findProperty('dev_jei') ?: 'false').toString().toBoolean()) {
        runtimeOnly "mezz.jei:jei-26.1-neoforge:${jei_version_26_1}"
    }
    if ((findProperty('dev_silent_gear') ?: 'false').toString().toBoolean()) {
        runtimeOnly "maven.modrinth:silent-gear:${silent_gear_version_26_1}"
        runtimeOnly "maven.modrinth:silent-lib:${silent_lib_version_26_1}"
    }
    if ((findProperty('dev_spartan_unofficial') ?: 'false').toString().toBoolean()) {
        runtimeOnly "maven.modrinth:spartan-weaponry-unofficial:${spartan_unofficial_version_26_1}"
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
        version        : project.version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_description: mod_description,
        mod_authors    : mod_authors,
        mod_license    : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}



publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = project.base.archivesName.get()
            version = project.version
            artifact jar
            artifact sourcesJar
            pom {
                name = "${mod_name} (NeoForge 26.1)"
                description = mod_description
            }
        }
    }
}
